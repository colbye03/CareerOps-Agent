name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Build distributable
        run: python -m pip wheel --no-deps . -w dist
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/careerops-wheel
          /tmp/careerops-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/careerops-wheel/bin/careerops --workspace /tmp/careerops-demo init --persona technical-program-manager
          /tmp/careerops-wheel/bin/careerops --workspace /tmp/careerops-demo run
          /tmp/careerops-wheel/bin/careerops --workspace /tmp/careerops-demo jobs
